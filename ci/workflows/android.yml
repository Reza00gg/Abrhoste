name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API base URL the APK should talk to (e.g. https://lenumoviz.vercel.app)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Capacitor → APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          VITE_API_BASE: ${{ inputs.api_base || vars.API_BASE }}
        run: |
          echo "API base = '${VITE_API_BASE}'"
          npm run build

      - name: Generate the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon + native splash (from assets/)
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Allow in-app update installs
        run: |
          # REQUEST_INSTALL_PACKAGES so the app can hand the downloaded APK to the installer
          m=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES "$m" || \
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>|' "$m"
          grep INSTALL_PACKAGES "$m" || true

      - name: Keep launcher icons & splash out of the resource shrinker
        run: |
          mkdir -p android/app/src/main/res/raw
          cat > android/app/src/main/res/raw/keep.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@mipmap/ic_launcher,@mipmap/ic_launcher_round,@mipmap/ic_launcher_foreground,@mipmap/ic_launcher_background,@drawable/splash,@drawable/ic_launcher_background,@drawable/ic_launcher_foreground" />
          XML

      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/lenumoviz.p12
          ls -la android/app/lenumoviz.p12

      - name: Wire signing + shrink into Gradle
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file("lenumoviz.p12")
                      storeType "pkcs12"
                      storePassword "$KS_PASS"
                      keyAlias "$KS_ALIAS"
                      keyPassword "$KS_PASS"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: Stamp version (name from package.json, code from run number)
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Force dark, edge-to-edge splash background
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#E11D48</color>
          </resources>
          XML
          # Capacitor's template already defines ic_launcher_background — just recolor it
          f=android/app/src/main/res/values/ic_launcher_background.xml
          if [ -f "$f" ]; then
            sed -i 's|<color name="ic_launcher_background">.*</color>|<color name="ic_launcher_background">#000000</color>|' "$f"
          fi

      - name: Assemble signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename artifact
        id: apk
        run: |
          src="android/app/build/outputs/apk/release/app-release.apk"
          VER=$(node -p "require('./package.json').version")
          out="LenuMoviz-v${VER}.apk"
          cp "$src" "$out"
          ls -lh "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "### 📦 APK ready: \`$out\` ($(du -h "$out" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LenuMoviz-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.apk.outputs.ver }}-b${{ github.run_number }}
          name: LenuMoviz v${{ steps.apk.outputs.ver }} (build ${{ github.run_number }})
          body: |
            **Signed release APK** — built from `${{ github.sha }}`.
            API base: `${{ inputs.api_base || vars.API_BASE || '(same origin — web only)' }}`

            - امضای ثابت: آپدیت مستقیم روی نسخه‌های قبلی نصب می‌شود (بدون حذف)
            - بروزرسانی داخل برنامه: اپ خودش نسخه جدید را پیدا، دانلود و نصب می‌کند

            نصب: فایل APK را دانلود کن و روی گوشی نصب کن (نصب از منابع ناشناس را فعال کن).
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
