name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API base URL the APK should talk to (e.g. https://lenumoviz.vercel.app)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Capacitor → APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          VITE_API_BASE: ${{ inputs.api_base || vars.API_BASE }}
        run: |
          echo "API base = '${VITE_API_BASE}'"
          npm run build

      - name: Generate the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon + native splash (from assets/)
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Stamp version (name from package.json, code from run number)
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Force dark, edge-to-edge splash background
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#E11D48</color>
          </resources>
          XML
          # Capacitor's template already defines ic_launcher_background — just recolor it
          f=android/app/src/main/res/values/ic_launcher_background.xml
          if [ -f "$f" ]; then
            sed -i 's|<color name="ic_launcher_background">.*</color>|<color name="ic_launcher_background">#000000</color>|' "$f"
          fi

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        id: apk
        run: |
          src="android/app/build/outputs/apk/debug/app-debug.apk"
          VER=$(node -p "require('./package.json').version")
          out="LenuMoviz-v${VER}.apk"
          cp "$src" "$out"
          ls -lh "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "### 📦 APK ready: \`$out\` ($(du -h "$out" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LenuMoviz-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.apk.outputs.ver }}-b${{ github.run_number }}
          name: LenuMoviz v${{ steps.apk.outputs.ver }} (build ${{ github.run_number }})
          body: |
            Debug APK built from `${{ github.sha }}`.
            API base: `${{ inputs.api_base || vars.API_BASE || '(same origin — web only)' }}`

            نصب: فایل APK را دانلود کن و روی گوشی نصب کن (نصب از منابع ناشناس را فعال کن).
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
